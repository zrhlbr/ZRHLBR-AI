workflows:
  zrhlbr-ai-ios-device:
    name: ZRHLBR AI iOS Device
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 22

    scripts:
      - name: Install Node dependencies
        script: |
          npm ci

      - name: Install CocoaPods
        script: |
          cd ios/App
          if [ -f Podfile ]; then
            pod install
          else
            echo "NO_PODFILE_USING_SPM"
          fi

      - name: Build iOS device application
        script: |
          cd ios/App

          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="$(find ios/App/build-device/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -type d | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "DEVICE_APP_NOT_FOUND"
            exit 30
          fi

          echo "DEVICE_APP=$APP_PATH"

          rm -rf /tmp/zrhlbr-ipa
          mkdir -p /tmp/zrhlbr-ipa/Payload

          cp -R "$APP_PATH" /tmp/zrhlbr-ipa/Payload/

          cd /tmp/zrhlbr-ipa
          zip -qry /tmp/ZRHLBR-AI-unsigned.ipa Payload

          test -f /tmp/ZRHLBR-AI-unsigned.ipa

          echo "===== IPA ====="
          ls -lh /tmp/ZRHLBR-AI-unsigned.ipa

          echo "===== IPA CONTENT CHECK ====="
          unzip -l /tmp/ZRHLBR-AI-unsigned.ipa | head -40

          echo "UNSIGNED_IPA=PASS"

    artifacts:
      - /tmp/ZRHLBR-AI-unsigned.ipa
      - ios/App/build-device/Build/Products/Release-iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - zhaoronghua180@gmail.com
        notify:
          success: true
          failure: true
