workflows:
  zrhlbr-ai-ios:
    name: ZRHLBR AI iOS
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: 22

    scripts:
      - name: Install Node dependencies
        script: |
          npm ci

      - name: Install CocoaPods
        script: |
          cd ios/App
          if [ -f Podfile ]; then
            pod install
          else
            echo "NO_PODFILE_USING_SPM"
          fi

      - name: Build iOS application
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - ios/App/build/Build/Products/**/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        notify:
          success: true
          failure: true
